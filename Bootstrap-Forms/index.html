<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đăng ký tài khoản</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="register-page">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-12 col-md-8 col-lg-6 col-xl-5">

                <div class="register-card">

                    <!-- TIÊU ĐỀ -->
                    <div class="text-center mb-4">

                        <div class="register-icon">
                            👤
                        </div>

                        <h2 class="fw-bold mb-2">
                            Đăng ký tài khoản
                        </h2>

                        <p class="text-muted mb-0">
                            Vui lòng nhập thông tin để tạo tài khoản mới
                        </p>

                    </div>


                    <!-- FORM -->
                    <form>

                        <!-- HỌ TÊN -->
                        <div class="mb-3">

                            <label
                                for="fullname"
                                class="form-label fw-semibold"
                            >
                                Họ và tên
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="fullname"
                                placeholder="Nhập họ và tên"
                                required
                            >

                        </div>


                        <!-- EMAIL -->
                        <div class="mb-3">

                            <label
                                for="email"
                                class="form-label fw-semibold"
                            >
                                Email
                            </label>

                            <input
                                type="email"
                                class="form-control"
                                id="email"
                                placeholder="example@gmail.com"
                                required
                            >

                            <div class="form-text">
                                Chúng tôi sẽ không chia sẻ email của bạn.
                            </div>

                        </div>


                        <!-- MẬT KHẨU -->
                        <div class="mb-3">

                            <label
                                for="password"
                                class="form-label fw-semibold"
                            >
                                Mật khẩu
                            </label>

                            <input
                                type="password"
                                class="form-control"
                                id="password"
                                placeholder="Nhập mật khẩu"
                                required
                            >

                        </div>


                        <!-- XÁC NHẬN MẬT KHẨU -->
                        <div class="mb-4">

                            <label
                                for="confirmPassword"
                                class="form-label fw-semibold"
                            >
                                Xác nhận mật khẩu
                            </label>

                            <input
                                type="password"
                                class="form-control"
                                id="confirmPassword"
                                placeholder="Nhập lại mật khẩu"
                                required
                            >

                        </div>


                        <!-- GIỚI TÍNH -->
                        <div class="mb-4">

                            <label class="form-label fw-semibold d-block">
                                Giới tính
                            </label>

                            <div class="d-flex flex-wrap gap-4">

                                <div class="form-check">

                                    <input
                                        class="form-check-input"
                                        type="radio"
                                        name="gender"
                                        id="male"
                                        value="Nam"
                                        checked
                                    >

                                    <label
                                        class="form-check-label"
                                        for="male"
                                    >
                                        Nam
                                    </label>

                                </div>


                                <div class="form-check">

                                    <input
                                        class="form-check-input"
                                        type="radio"
                                        name="gender"
                                        id="female"
                                        value="Nữ"
                                    >

                                    <label
                                        class="form-check-label"
                                        for="female"
                                    >
                                        Nữ
                                    </label>

                                </div>


                                <div class="form-check">

                                    <input
                                        class="form-check-input"
                                        type="radio"
                                        name="gender"
                                        id="other"
                                        value="Khác"
                                    >

                                    <label
                                        class="form-check-label"
                                        for="other"
                                    >
                                        Khác
                                    </label>

                                </div>

                            </div>

                        </div>


                        <!-- SỞ THÍCH -->
                        <div class="mb-4">

                            <label class="form-label fw-semibold d-block">
                                Sở thích
                            </label>


                            <div class="row">

                                <div class="col-6">

                                    <div class="form-check">

                                        <input
                                            class="form-check-input"
                                            type="checkbox"
                                            id="music"
                                        >

                                        <label
                                            class="form-check-label"
                                            for="music"
                                        >
                                            Âm nhạc
                                        </label>

                                    </div>

                                </div>


                                <div class="col-6">

                                    <div class="form-check">

                                        <input
                                            class="form-check-input"
                                            type="checkbox"
                                            id="sport"
                                        >

                                        <label
                                            class="form-check-label"
                                            for="sport"
                                        >
                                            Thể thao
                                        </label>

                                    </div>

                                </div>


                                <div class="col-6 mt-2">

                                    <div class="form-check">

                                        <input
                                            class="form-check-input"
                                            type="checkbox"
                                            id="travel"
                                        >

                                        <label
                                            class="form-check-label"
                                            for="travel"
                                        >
                                            Du lịch
                                        </label>

                                    </div>

                                </div>


                                <div class="col-6 mt-2">

                                    <div class="form-check">

                                        <input
                                            class="form-check-input"
                                            type="checkbox"
                                            id="reading"
                                        >

                                        <label
                                            class="form-check-label"
                                            for="reading"
                                        >
                                            Đọc sách
                                        </label>

                                    </div>

                                </div>

                            </div>

                        </div>


                        <!-- QUỐC GIA -->
                        <div class="mb-4">

                            <label
                                for="country"
                                class="form-label fw-semibold"
                            >
                                Quốc gia
                            </label>

                            <select
                                class="form-select"
                                id="country"
                                required
                            >

                                <option value="" selected disabled>
                                    -- Chọn quốc gia --
                                </option>

                                <option>Việt Nam</option>
                                <option>Nhật Bản</option>
                                <option>Hàn Quốc</option>
                                <option>Singapore</option>
                                <option>Hoa Kỳ</option>

                            </select>

                        </div>


                        <!-- BUTTON -->
                        <div class="d-grid">

                            <button
                                type="submit"
                                class="btn btn-primary btn-lg"
                            >
                                Đăng ký
                            </button>

                        </div>


                        <p class="text-center text-muted mt-4 mb-0">
                            Bạn đã có tài khoản?
                            <a href="#" class="text-decoration-none fw-semibold">
                                Đăng nhập
                            </a>
                        </p>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- Bootstrap JS -->
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
